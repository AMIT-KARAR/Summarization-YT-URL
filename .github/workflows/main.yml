name: Sync GitHub Repo to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-to-hf-space:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      # ✅ Proper HF authentication (NEW WAY)
      - name: Authenticate with Hugging Face
        run: |
          git config --global credential.helper store
          echo "https://Amitkarar:${{ secrets.HF_TOKEN }}@huggingface.co" > ~/.git-credentials

      - name: Add HF Space remote
        run: |
          git remote remove hf || true
          git remote add hf https://huggingface.co/spaces/Amitkarar/YTvideoandURLsummarization

      - name: Push to HF Space
        run: git push hf main --force
