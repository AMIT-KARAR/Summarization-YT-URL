name: DEBUG HF PUSH

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show files
        run: ls -la

      - name: Configure git
        run: |
          git config --global user.name "test"
          git config --global user.email "test@test.com"

      - name: Remove old remote
        run: git remote remove hf || true

      - name: Add remote
        run: |
          git remote add hf https://Amitkarar:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Amitkarar/Summarization-YT-URL

      - name: Show remotes
        run: git remote -v

      - name: Try push
        run: git push hf main --force
