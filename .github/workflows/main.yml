name: Sync GitHub Repo to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hf-space:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Hugging Face CLI
        run: pip install huggingface_hub

      # ✅ Proper authentication (HF supported way)
      - name: Login to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          huggingface-cli login --token $HF_TOKEN

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Add HF Space remote
        run: |
          git remote remove hf || true
          git remote add hf https://huggingface.co/spaces/Amitkarar/YTvideoandURLsummarization

      - name: Push to HF Space
        run: git push hf main --force
