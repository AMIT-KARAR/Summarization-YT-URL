name: Sync GitHub Repo to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-to-hf-space:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Clean old remotes
        run: git remote remove hf || true

      - name: Add HF Space remote
        run: |
          git remote add hf https://git:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Amitkarar/YTvideoandURLsummarization

      - name: Push to HF Space
        run: git push hf main --force
