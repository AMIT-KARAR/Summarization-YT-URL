name: Sync GitHub Repo to Hugging Face Space

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# ✅ Fix Node 24 deprecation warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  sync-to-hf-space:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # STEP 1 — Checkout your GitHub repository code
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # STEP 2 — Configure Git identity (required for push)
      # ------------------------------------------------------------
      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      # ------------------------------------------------------------
      # STEP 3 — Add Hugging Face Space as a second remote
      # ------------------------------------------------------------
      - name: Add Hugging Face remote
        run: |
          git remote add hf https://Amitkarar:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Amitkarar/Chatboat_With_PDF

      # ------------------------------------------------------------
      # STEP 4 — Push ALL files from GitHub to Hugging Face Space
      # ------------------------------------------------------------
      - name: Push code to Hugging Face Space
        run: |
          git push hf main --force
