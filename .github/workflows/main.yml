name: Sync GitHub Repo to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-to-hf-space:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout your GitHub repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Configure Git identity
      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      # 3) Remove any old remote (prevents exit 128)
      - name: Clean old remotes
        run: git remote remove hf || true

      # 4) Add Hugging Face Space as remote
      - name: Add HF Space remote
        run: |
          git remote add hf https://Amitkarar:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/Amitkarar/YTvideoandURLsummarization

      # 5) Push to HF Space
      - name: Push to HF Space
        run: git push hf main --force
